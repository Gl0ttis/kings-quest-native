# King's Quest I native ports: one crate set per original platform under ports/.
[workspace]
resolver = "2"
members = [
    "crates/kq1-formats",
    "crates/kq1-frontend",
    "crates/kq1-ibm",
    "crates/kq1-x86",
    "ports/apple2",
    "ports/apple2/refemu",
    "ports/pc",
    "ports/pc/refemu",
    "ports/pcjr",
    "ports/pcjr/refemu",
]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/Gl0ttis/kings-quest-native"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
# Indexed loops mirror the original's table walks; kept deliberately.
needless_range_loop = "allow"
type_complexity = "allow"
too_many_arguments = "allow"

[profile.release]
debug = 1
