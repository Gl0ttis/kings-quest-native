[package]
name = "kq1-frontend"
version = "0.1.0"
description = "The platform side the native King's Quest players share: the Windows paint hook, full screen, the joystick, the error box."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "kq1_frontend"
path = "src/lib.rs"

[dependencies]
minifb = { version = "0.29.0", default-features = false, features = ["x11"] }

# Linux: full screen through Xlib, on the window's handles.
[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = "2.21"
raw-window-handle = "0.6"
