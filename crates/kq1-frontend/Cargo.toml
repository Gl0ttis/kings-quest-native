[package]
name = "kq1-frontend"
version = "0.1.0"
description = "The platform side the native King's Quest players share: the Windows paint hook, full screen, the joystick, the error box, and the IBM PC and PCjr players' clocks, window and sound output."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "kq1_frontend"
path = "src/lib.rs"

[dependencies]
minifb = { version = "0.29.0", default-features = false, features = ["x11"] }
# The IBM PC and PCjr engines' clock, which the players' clocks give events to.
kq1-ibm = { path = "../kq1-ibm" }

# Linux: full screen through Xlib, on the window's handles.
[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = "2.21"
raw-window-handle = "0.6"
# The sound output.
cpal = "0.15"
