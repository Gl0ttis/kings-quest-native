[package]
name = "kq1-pcjr"
version = "0.2.0"
description = "Native port of the 1984 IBM PCjr King's Quest: engine, player (kq-pcjr) and tools. Runs on the user's own disk image."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "kq1_pcjr"
path = "src/lib.rs"

[dependencies]
# The resource formats (views, scripts, the vocabulary), shared with the other ports:
# the PCjr's use the same formats (docs/disk-layout.md).
kq1-formats = { path = "../../crates/kq1-formats" }
# What the IBM PC and PCjr engines share (the picture painter).
kq1-ibm = { path = "../../crates/kq1-ibm" }
# Only the windowed player (kq-pcjr) uses it; the engine library has no other
# dependencies. X11 only on Linux (Wayland desktops run it through XWayland).
minifb = { version = "0.29.0", optional = true, default-features = false, features = ["x11"] }

# The platform side the players share (crates/kq1-frontend), with the player.
kq1-frontend = { path = "../../crates/kq1-frontend", optional = true }
# The half the IBM players share (crates/kq1-ibm-player), with the player.
kq1-ibm-player = { path = "../../crates/kq1-ibm-player", optional = true }

# Linux: sound (cpal).
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.15", optional = true }

[features]
default = ["player"]
player = ["dep:minifb", "dep:cpal", "dep:kq1-frontend", "dep:kq1-ibm-player"]

[[bin]]
name = "kqextract-pcjr"
path = "src/bin/kqextract-pcjr.rs"

# Shipped as `kq` (the release archive renames it); `kq-pcjr` in the workspace, where
# each port's player needs a name of its own.
[[bin]]
name = "kq-pcjr"
path = "src/bin/kq-pcjr.rs"
required-features = ["player"]

# Named apart from the other ports' examples of the same names, which share the
# workspace's target folder.
[[example]]
name = "costdump-pcjr"
path = "examples/costdump.rs"

[[example]]
name = "primap-pcjr"
path = "examples/primap.rs"
