[package]
name = "kq1-pcjr-refemu"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Reference IBM PCjr (8088) used only to measure the original PCjr King's Quest. Not part of the port."

[lints]
workspace = true

[lib]
name = "kq1_pcjr_refemu"
path = "src/lib.rs"

[[bin]]
name = "refemu-pcjr"
path = "src/main.rs"

[[bin]]
name = "kqroute-pcjr"
path = "src/bin/kqroute.rs"

[[bin]]
name = "kqprobe-pcjr"
path = "src/bin/kqprobe.rs"

[dependencies]
kq1-pcjr = { path = ".." }
kq1-apple2 = { path = "../../apple2", default-features = false }
