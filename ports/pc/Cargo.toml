[package]
name = "kq1-pc"
version = "0.1.1"
description = "Native port of the 1984 IBM PC King's Quest (CGA, composite colour): engine, player and tools. Runs on the user's own disk image."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "kq1_pc"
path = "src/lib.rs"

[dependencies]
# The resource formats (views, scripts, the vocabulary) and the MFM disk images,
# shared with the other ports.
kq1-formats = { path = "../../crates/kq1-formats" }
# What the IBM PC and PCjr engines share (the picture painter).
kq1-ibm = { path = "../../crates/kq1-ibm" }
# Only the windowed player (kq-pc) uses it; the engine library has no other
# dependencies. X11 only on Linux (Wayland desktops run it through XWayland).
minifb = { version = "0.29.0", optional = true, default-features = false, features = ["x11"] }

# The platform side the players share (crates/kq1-frontend), with the player.
kq1-frontend = { path = "../../crates/kq1-frontend", optional = true }

# Linux: sound (cpal).
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.15", optional = true }

[features]
default = ["player"]
player = ["dep:minifb", "dep:cpal", "dep:kq1-frontend"]

[[bin]]
name = "kqextract-pc"
path = "src/bin/kqextract-pc.rs"

# Shipped as `kq` (the release archive renames it); `kq-pc` in the workspace, where
# each port's player needs a name of its own.
[[bin]]
name = "kq-pc"
path = "src/bin/kq-pc.rs"
required-features = ["player"]

# The speed model's tools, named apart from the PCjr port's, whose examples share the
# workspace's target folder.
[[example]]
name = "costdump-pc"
path = "examples/costdump.rs"

[[example]]
name = "drawcmp-pc"
path = "examples/drawcmp.rs"

[[example]]
name = "speedcmp-pc"
path = "examples/speedcmp.rs"
