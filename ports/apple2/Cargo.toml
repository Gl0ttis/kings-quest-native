[package]
name = "kq1-apple2"
version = "0.1.0"
description = "Native port of the 1984 Apple IIe King's Quest: engine, player (kq) and tools. Runs on the user's own disk images."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "kq1_apple2"
path = "src/lib.rs"

[[bin]]
name = "nibdecode"
path = "src/bin/nibdecode.rs"

[dependencies]
# Only the windowed player (kq) uses it; the engine library has no dependencies.
# X11 only on Linux (Wayland desktops run it through XWayland): X11 allows full screen.
minifb = { version = "0.29.0", optional = true, default-features = false, features = ["x11"] }

# Linux: sound (cpal) and full screen (Xlib through the window's handles).
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.15", optional = true }
x11-dl = { version = "2.21", optional = true }
raw-window-handle = { version = "0.6", optional = true }

[features]
default = ["player"]
player = ["dep:minifb", "dep:cpal", "dep:x11-dl", "dep:raw-window-handle"]

[[bin]]
name = "kqextract"
path = "src/bin/kqextract.rs"

[[bin]]
name = "kqpic"
path = "src/bin/kqpic.rs"

[[bin]]
name = "kqscript"
path = "src/bin/kqscript.rs"

[[bin]]
name = "kqview"
path = "src/bin/kqview.rs"

[[bin]]
name = "kqroom"
path = "src/bin/kqroom.rs"

[[bin]]
name = "kq"
path = "src/bin/kq.rs"
required-features = ["player"]

[[bin]]
name = "kqroute"
path = "src/bin/kqroute.rs"
