# Every push to main: release-plz (release-plz.toml) keeps a release pull request open
# with the next versions and changelogs, from the conventional commits, and each port's
# player is built for Windows and Linux (downloadable from the run):
# kq-<port>-<version>-<platform> archives, the player in each as kq. The release pull
# request merges itself once its checks pass (auto-merge). On that push, release-plz
# tags each package whose version it raised and makes the ports' GitHub releases, and
# the builds are attached to them.
#
# release-plz uses its own token, RELEASE_PLEASE_TOKEN (CONTRIBUTING.md), not this
# workflow's: GitHub starts no workflows for what GITHUB_TOKEN does, so the release pull
# request would get no checks, and a merge made with it wouldn't start this workflow.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# One run at a time, so that two pushes don't both release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      apple2-tag: ${{ steps.tags.outputs.apple2 }}
      pcjr-tag: ${{ steps.tags.outputs.pcjr }}
      pc-tag: ${{ steps.tags.outputs.pc }}
    steps:
      # The whole history and its tags: release-plz finds each package's last release
      # by its tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      # Tag and release what the release pull request raised, when it was this push.
      - uses: release-plz/action@v0.5
        id: release
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
      - uses: release-plz/action@v0.5
        id: release-pr
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
      # Merge the release pull request as soon as its checks pass. With the same token,
      # so that the merge, made as its owner, starts this workflow, which releases.
      - name: Auto-merge the release pull request
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          PR: ${{ steps.release-pr.outputs.pr }}
        run: |
          number=$(jq -r '.number? // empty' <<<"${PR:-null}")
          if [ -n "$number" ]; then gh pr merge "$number" -R "$GITHUB_REPOSITORY" --auto --squash; fi
      # The tag of each port released by this push, if it was.
      - name: Released ports
        id: tags
        env:
          RELEASES: ${{ steps.release.outputs.releases }}
        run: |
          for port in apple2 pcjr pc; do
            tag=$(jq -r --arg p "kq1-$port" '.[]? | select(.package_name == $p) | .tag' <<<"${RELEASES:-[]}")
            echo "$port=$tag" >> "$GITHUB_OUTPUT"
            [ -n "$tag" ] && echo "released $tag"
          done
          true

  build:
    name: kq-apple2 (${{ matrix.name }})
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            exe: .exe
          - name: linux-x64
            os: ubuntu-latest
            exe: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux window and sound libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbcommon-dev libxcursor-dev libxrandr-dev libasound2-dev
      - name: Build
        run: cargo build --release --locked -p kq1-apple2 --bin kq-apple2
      # The archive: kq-apple2-<version>-<platform>/, the player in it as kq (every
      # port's runs as kq), with the licence and the player's guide.
      - name: Package
        id: package
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' ports/apple2/Cargo.toml | head -1)
          dir="kq-apple2-$version-${{ matrix.name }}"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          mkdir "$dir"
          cp "target/release/kq-apple2${{ matrix.exe }}" "$dir/kq${{ matrix.exe }}"
          cp LICENSE "$dir/"
          cp ports/apple2/PLAYING.md "$dir/README.md"
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a "$dir.zip" "$dir" > /dev/null; else tar czf "$dir.tar.gz" "$dir"; fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.dir }}
          path: ${{ steps.package.outputs.dir }}.*
      - name: Attach to the release
        if: needs.release.outputs.apple2-tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release.outputs.apple2-tag }}" ${{ steps.package.outputs.dir }}.* --clobber

  build-pcjr:
    name: kq-pcjr (${{ matrix.name }})
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            exe: .exe
          - name: linux-x64
            os: ubuntu-latest
            exe: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux window and sound libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbcommon-dev libxcursor-dev libxrandr-dev libasound2-dev
      - name: Build
        run: cargo build --release --locked -p kq1-pcjr --bin kq-pcjr
      # The archive: kq-pcjr-<version>-<platform>/, the player in it as kq (every
      # port's runs as kq), with the licence and the player's guide.
      - name: Package
        id: package
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' ports/pcjr/Cargo.toml | head -1)
          dir="kq-pcjr-$version-${{ matrix.name }}"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          mkdir "$dir"
          cp "target/release/kq-pcjr${{ matrix.exe }}" "$dir/kq${{ matrix.exe }}"
          cp LICENSE "$dir/"
          cp ports/pcjr/PLAYING.md "$dir/README.md"
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a "$dir.zip" "$dir" > /dev/null; else tar czf "$dir.tar.gz" "$dir"; fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.dir }}
          path: ${{ steps.package.outputs.dir }}.*
      - name: Attach to the release
        if: needs.release.outputs.pcjr-tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release.outputs.pcjr-tag }}" ${{ steps.package.outputs.dir }}.* --clobber

  build-pc:
    name: kq-pc (${{ matrix.name }})
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            exe: .exe
          - name: linux-x64
            os: ubuntu-latest
            exe: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux window and sound libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbcommon-dev libxcursor-dev libxrandr-dev libasound2-dev
      - name: Build
        run: cargo build --release --locked -p kq1-pc --bin kq-pc
      # The archive: kq-pc-<version>-<platform>/, the player in it as kq (every
      # port's runs as kq), with the licence and the player's guide.
      - name: Package
        id: package
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' ports/pc/Cargo.toml | head -1)
          dir="kq-pc-$version-${{ matrix.name }}"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          mkdir "$dir"
          cp "target/release/kq-pc${{ matrix.exe }}" "$dir/kq${{ matrix.exe }}"
          cp LICENSE "$dir/"
          cp ports/pc/PLAYING.md "$dir/README.md"
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a "$dir.zip" "$dir" > /dev/null; else tar czf "$dir.tar.gz" "$dir"; fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.dir }}
          path: ${{ steps.package.outputs.dir }}.*
      - name: Attach to the release
        if: needs.release.outputs.pc-tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release.outputs.pc-tag }}" ${{ steps.package.outputs.dir }}.* --clobber
