# Pull requests are squash-merged, so the title becomes the commit on main: it must be
# a conventional commit too (it drives the version bump and the changelog).
name: PR title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
  # The release pull request (release-please.yml): its title is release-please's own,
  # so the job is skipped, which counts as passing.
  workflow_dispatch:

permissions:
  pull-requests: read

jobs:
  title:
    name: Conventional PR title
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          scopes: |
            apple2
            refemu
            workspace
            ci
            deps
            docs
            release
          requireScope: false
